services:
  swe-swe-tunneld:
    build: .
    image: swe-swe-tunneld
    container_name: swe-swe-tunneld
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - tunnel-data:/var/lib/swe-swe-tunnel
      # Bind-mount the allowlist *directory* (not a single file). A
      # bind-mounted file pins the container's view to one inode; an
      # editor that writes via temp+rename — or `cp` over an existing
      # target — leaves the daemon looking at a now-unlinked file
      # forever. Mounting the directory means dropping/removing
      # files on the host shows up immediately on the next reload.
      # `:ro` constrains only the container — the host can still
      # edit freely.
      - ./allowlist:/etc/swe-swe-tunneld/allowlist:ro
    environment:
      DNSIMPLE_OAUTH_TOKEN: ${DNSIMPLE_OAUTH_TOKEN:?required}
      SWE_TUNNEL_APEX: ${SWE_TUNNEL_APEX:?required}
      SWE_TUNNEL_ACME_EMAIL: ${SWE_TUNNEL_ACME_EMAIL:?required}
      # Set via env (not command:) so it also covers `compose run` invocations
      # that override the entrypoint args (e.g. --ensure-cert).
      SWE_TUNNEL_STATE: /var/lib/swe-swe-tunnel
      # Optional: gate Register on a pubkey allowlist. Default unset
      # → registration is open (today's behavior). To enable, set
      # SWE_TUNNEL_ALLOWLIST_DIR in your .env (the directory is
      # already bind-mounted above):
      #
      #   SWE_TUNNEL_ALLOWLIST_DIR=/etc/swe-swe-tunneld/allowlist
      #
      # Then drop one *.pub file per friend into ./allowlist/ and
      # signal a reload+revoke with:
      #
      #   docker kill -s HUP swe-swe-tunneld
      #
      # An empty directory with the env set means deny-all.
      SWE_TUNNEL_ALLOWLIST_DIR: ${SWE_TUNNEL_ALLOWLIST_DIR:-}
      # Optional override of the destination port allowlist.
      # Default (unset) is portpolicy.DefaultSpec —
      # 1977,3000-3099,4000-4099,5000-5099,5173,8000-8099,8080,8081,9898.
      # Inline form (restart-only) — operator can set either:
      #   SWE_TUNNEL_ALLOWED_PORTS=1977,3000-3099,9898
      # File form (SIGHUP-reloadable) — mutually exclusive with
      # the inline form. Bind-mount your spec file in and point at
      # the in-container path:
      #   SWE_TUNNEL_ALLOWED_PORTS_FILE=/etc/swe-swe-tunneld/allowed-ports
      SWE_TUNNEL_ALLOWED_PORTS: ${SWE_TUNNEL_ALLOWED_PORTS:-}
      SWE_TUNNEL_ALLOWED_PORTS_FILE: ${SWE_TUNNEL_ALLOWED_PORTS_FILE:-}
    command:
      - --listen=:443
      # mTLS: require every browser AND every agent to present a
      # client cert signed by the CA at this path. The CA lives in
      # the tunnel-data volume (minted via `swe-swe-tunneld
      # mtls-init`). Reload SIGHUP-able; toggling on/off needs a
      # restart. See docs/mtls.md.
      - --mtls-ca=/var/lib/swe-swe-tunnel/mtls/ca.pem

volumes:
  tunnel-data:
