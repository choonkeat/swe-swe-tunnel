services:
  # One-shot: hand the state volume to the unprivileged daemon user.
  # Volumes created before the daemon dropped root hold root-owned
  # files (identities.db, certs, CA keys). Runs as root on every `up`,
  # touches only the volume, and exits; chown is a no-op when already
  # correct. No network, no capabilities beyond CHOWN/FOWNER.
  volume-perms:
    image: alpine:3.22
    user: "0:0"
    entrypoint: ["chown", "-R", "10001:10001", "/var/lib/swe-swe-tunnel"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - tunnel-data:/var/lib/swe-swe-tunnel
    restart: "no"

  swe-swe-tunneld:
    build: .
    image: swe-swe-tunneld
    container_name: swe-swe-tunneld
    restart: unless-stopped
    depends_on:
      volume-perms:
        condition: service_completed_successfully
    # Unprivileged: UID 10001 (set in the Dockerfile), no Linux
    # capabilities, no privilege gain via setuid binaries. Binding :443
    # works because unprivileged ports start at 0 in this container.
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "443:443"
    volumes:
      - tunnel-data:/var/lib/swe-swe-tunnel
      # Bind-mount the allowlist *directory* (not a single file). A
      # bind-mounted file pins the container's view to one inode; an
      # editor that writes via temp+rename — or `cp` over an existing
      # target — leaves the daemon looking at a now-unlinked file
      # forever. Mounting the directory means dropping/removing
      # files on the host shows up immediately on the next reload.
      # `:ro` constrains only the container — the host can still
      # edit freely.
      - ./allowlist:/etc/swe-swe-tunneld/allowlist:ro
    environment:
      DNSIMPLE_OAUTH_TOKEN: ${DNSIMPLE_OAUTH_TOKEN:?required}
      SWE_TUNNEL_APEX: ${SWE_TUNNEL_APEX:?required}
      SWE_TUNNEL_ACME_EMAIL: ${SWE_TUNNEL_ACME_EMAIL:?required}
      # Set via env (not command:) so it also covers `compose run` invocations
      # that override the entrypoint args (e.g. --ensure-cert).
      SWE_TUNNEL_STATE: /var/lib/swe-swe-tunnel
      # Register gate. The daemon refuses to start unless exactly one
      # of these is set. Default: the allowlist directory bind-mounted
      # above, so a fresh install lets nobody register until you drop
      # one *.pub file per user into ./allowlist/ and reload with:
      #
      #   docker kill -s HUP swe-swe-tunneld
      #
      # An empty directory means deny-all. To let ANY key register
      # (not recommended), set in .env:
      #
      #   SWE_TUNNEL_ALLOWLIST_DIR=
      #   SWE_TUNNEL_OPEN_REGISTRATION=1
      #
      # Release a claimed name with:
      #   docker compose exec swe-swe-tunneld swe-swe-tunneld identity-list
      #   docker compose exec swe-swe-tunneld swe-swe-tunneld identity-delete [--purge-cert] <unique>
      SWE_TUNNEL_ALLOWLIST_DIR: ${SWE_TUNNEL_ALLOWLIST_DIR-/etc/swe-swe-tunneld/allowlist}
      SWE_TUNNEL_OPEN_REGISTRATION: ${SWE_TUNNEL_OPEN_REGISTRATION:-}
      # Optional override of the destination port allowlist.
      # Default (unset) is portpolicy.DefaultSpec —
      # 1977,3000-3099,4000-4099,5000-5099,5173,8000-8099,8080,8081,9898.
      # Inline form (restart-only) — operator can set either:
      #   SWE_TUNNEL_ALLOWED_PORTS=1977,3000-3099,9898
      # File form (SIGHUP-reloadable) — mutually exclusive with
      # the inline form. Bind-mount your spec file in and point at
      # the in-container path:
      #   SWE_TUNNEL_ALLOWED_PORTS_FILE=/etc/swe-swe-tunneld/allowed-ports
      SWE_TUNNEL_ALLOWED_PORTS: ${SWE_TUNNEL_ALLOWED_PORTS:-}
      SWE_TUNNEL_ALLOWED_PORTS_FILE: ${SWE_TUNNEL_ALLOWED_PORTS_FILE:-}
    command:
      - --listen=:443
      # mTLS: uncomment to require every browser AND every agent
      # to present a client cert signed by the CA at this path.
      # The CA lives in the tunnel-data volume (mint via
      # `docker compose run --rm swe-swe-tunneld mtls-init`).
      # Reload SIGHUP-able; toggling on/off needs a container
      # recreate. See docs/mtls.md.
      # - --mtls-ca=/var/lib/swe-swe-tunnel/mtls/ca.pem

volumes:
  tunnel-data:
